name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab
    inputs:
      run_pipeline:
        description: "Also download C-MAPSS and run the full pipeline (--fast)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q   # synthetic data only; no download

  pipeline:
    # Only when started by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch' && inputs.run_pipeline
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: sudo apt-get install -y graphviz   # renders dfg.png
      - name: Run pipeline on FD001
        run: >
          python -m xpdm.run --data-dir data --out outputs --fast
          --mirror https://raw.githubusercontent.com/hankroark/Turbofan-Engine-Degradation/master/CMAPSSData
      - uses: actions/upload-artifact@v4
        with:
          name: xpdm-outputs-FD001
          path: outputs/
