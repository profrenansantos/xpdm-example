[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpdm"
version = "0.1.0"
description = "Explainable predictive maintenance: RUL prediction, process mining and multicriteria ranking on NASA C-MAPSS"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Renan Silva Santos", email = "renan.santos@ieee.org"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
llm = ["anthropic"]
dev = ["pytest", "nbformat", "nbconvert", "ipykernel"]

[project.scripts]
xpdm = "xpdm.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
